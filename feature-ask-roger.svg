<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-label="Ask Roger: the mascot waves as a question about the largest spike gets a typed answer: This part shows a $51.96 spike in quarry-etl, caused by the cache expiring during long tool calls. The biggest cause is 12 requests that ran after a Bash call took 13 minutes, past the 5-minute cache lifetime, so 7.7M tokens were written again.">
<title>Ask Roger: the mascot waves as a question about the largest spike gets a typed answer: This part shows a $51.96 spike in quarry-etl, caused by the cache expiring during long tool calls. The biggest cause is 12 requests that ran after a Bash call took 13 minutes, past the 5-minute cache lifetime, so 7.7M tokens were written again.</title>
