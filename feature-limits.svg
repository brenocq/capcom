<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-label="Limits: the weekly usage rising and dropping to zero at each reset, then a forecast fan from now to the next reset (median 86 %, 62 to 127 %); beside it, the 5-hour window at 20 % now and 60 % at its reset, the weekly at 51 % and 86 %.">
