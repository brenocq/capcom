<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-label="Limits: the weekly usage rising and dropping to zero at each reset, then a forecast fan from now to the next reset (median 89 %, 66 to 120 %); beside it, the 5-hour window at 18 % now and 74 % at its reset, the weekly at 52 % and 89 %.">
<title>Limits: the weekly usage rising and dropping to zero at each reset, then a forecast fan from now to the next reset (median 89 %, 66 to 120 %); beside it, the 5-hour window at 18 % now and 74 % at its reset, the weekly at 52 % and 89 %.</title>
