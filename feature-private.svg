<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-label="Private: a padlock snapping shut beside three checks: reads your logs read-only, no network (Ask Roger only, when you turn it on), tool details read live and never stored.">
<title>Private: a padlock snapping shut beside three checks: reads your logs read-only, no network (Ask Roger only, when you turn it on), tool details read live and never stored.</title>
<style>svg{--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--surface:#f6f8fa;--panel:#ffffff;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--gray:#D1CFC5;--accent:#D97757;--clay:#A84E2D;--ok:#558A42}@media (prefers-color-scheme:dark){svg{--fg:#f0f6fc;--muted:#9198a1;--border:#3d444d;--surface:#151b23;--panel:#0d1117;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--gray:#5E5D59;--accent:#D97757;--clay:#F0A07E;--ok:#7FB069}}text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.clay{fill:var(--clay)}.surface{fill:var(--surface);stroke:var(--border)}.panel{fill:var(--panel);stroke:var(--border)}.grid{stroke:var(--border);stroke-dasharray:2 3}.title{fill:var(--fg);font-size:16px;font-weight:600}.desc{fill:var(--muted);font-size:13px}.scene{animation:scene 9s linear infinite}@keyframes scene{0%{opacity:0}3.33%{opacity:1}92.22%{opacity:1}97.78%{opacity:0}100%{opacity:0}}.k1{transform:translateY(0);animation:k1 9s infinite}@keyframes k1{0%{transform:translateY(-9px)}11.11%{transform:translateY(-9px);animation-timing-function:cubic-bezier(.5,0,.6,1.6)}15%{transform:translateY(0)}100%{transform:translateY(0)}}.k2{opacity:1;animation:k2 9s infinite}@keyframes k2{0%{opacity:0}14.44%{opacity:0;animation-timing-function:cubic-bezier(.3,.7,.4,1)}18.89%{opacity:1}100%{opacity:1}}.k3{opacity:1;transform:translateX(0);animation:k3 9s infinite}@keyframes k3{0%{opacity:0;transform:translateX(-8px)}18.89%{opacity:0;transform:translateX(-8px);animation-timing-function:cubic-bezier(.3,.7,.4,1)}23.89%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(0)}}.k4{opacity:1;transform:translateX(0);animation:k4 9s infinite}@keyframes k4{0%{opacity:0;transform:translateX(-8px)}24.44%{opacity:0;transform:translateX(-8px);animation-timing-function:cubic-bezier(.3,.7,.4,1)}29.44%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(0)}}.k5{opacity:1;transform:translateX(0);animation:k5 9s infinite}@keyframes k5{0%{opacity:0;transform:translateX(-8px)}30%{opacity:0;transform:translateX(-8px);animation-timing-function:cubic-bezier(.3,.7,.4,1)}35%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

<rect class="surface" x=".5" y=".5" width="419" height="239" rx="12"/><rect class="panel" x="12.5" y="12.5" width="395" height="149" rx="8"/><g class="scene"><circle class="k2" cx="82" cy="90" r="46" style="fill:var(--accent);fill-opacity:.12"/><path class="k1" d="M68 86v-12a14 14 0 0 1 28 0v12" fill="none" stroke-width="6" stroke-linecap="round" style="stroke:var(--fg)"/><rect x="58" y="84" width="48" height="38" rx="7" style="fill:var(--accent)"/><circle cx="82" cy="99" r="4.5" style="fill:var(--panel)"/><rect x="80.2" y="100" width="3.6" height="10" rx="1.8" style="fill:var(--panel)"/><g class="k3"><circle cx="160" cy="46" r="8" style="fill:var(--ok)"/><path d="M156 46l3 3l5 -6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--panel)"/><text class="fg" x="176" y="50" font-size="12.5" font-weight="600">Reads your logs read-only</text><text class="muted" x="176" y="65" font-size="11">never writes, moves or locks them</text></g><g class="k4"><circle cx="160" cy="86" r="8" style="fill:var(--ok)"/><path d="M156 86l3 3l5 -6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--panel)"/><text class="fg" x="176" y="90" font-size="12.5" font-weight="600">No network</text><text class="muted" x="176" y="105" font-size="11">Ask Roger only, when you turn it on</text></g><g class="k5"><circle cx="160" cy="126" r="8" style="fill:var(--ok)"/><path d="M156 126l3 3l5 -6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--panel)"/><text class="fg" x="176" y="130" font-size="12.5" font-weight="600">Tool details read live</text><text class="muted" x="176" y="145" font-size="11">never stored, cached or exported</text></g></g><text class="title" x="16" y="185">Private</text><text class="desc"><tspan x="16" y="206">Your logs hold your conversations: capcom reads</tspan><tspan x="16" y="224">them where they are and keeps it all local.</tspan></text>
