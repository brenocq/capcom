<!doctype html>
<!-- The demo's window: a macOS-style frame (traffic lights, title bar, rounded
     corners, soft shadow) around a screenshot of capcom's page, with a cursor,
     and under it a caption strip naming the story's steps, the current one
     highlighted. Light by default; <body class="dark"> for GitHub's dark theme.
     record.py loads it in headless Chrome and calls show() for every frame. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  body { --win: #FAF9F5; --bar: #EDEBE4; --edge: rgba(0, 0, 0, .14); --ring: rgba(0, 0, 0, .3);
    --title: #55534d; --dim: #8a877f; --fg: #1f2328; --muted: #59636e; --accent: #D97757;
    --shadow: 0 18px 40px rgba(0, 0, 0, .22), 0 4px 12px rgba(0, 0, 0, .1); }
  body.dark { --win: #262624; --bar: #2f2e2b; --edge: rgba(255, 255, 255, .08); --ring: rgba(255, 255, 255, .16);
    --title: #d6d3ca; --dim: #9a978f; --fg: #f0f6fc; --muted: #9198a1;
    --shadow: 0 18px 40px rgba(0, 0, 0, .55), 0 4px 12px rgba(0, 0, 0, .35); }
  .stage { padding: 22px 40px 0; width: 1160px; height: 834px; }
  .win { position: relative; width: 1160px; border-radius: 12px; overflow: hidden; background: var(--win);
    box-shadow: var(--shadow), 0 0 0 .5px var(--ring); }
  .bar { position: relative; height: 34px; display: flex; align-items: center; background: var(--bar);
    border-bottom: .5px solid var(--edge); }
  .lights { display: flex; gap: 8px; padding-left: 14px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .18); }
  .title { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 7px;
    font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; color: var(--title); }
  .title small { font-weight: 400; color: var(--dim); }
  .screen { position: relative; width: 1160px; height: 720px; }
  .screen img { position: absolute; inset: 0; width: 1160px; height: 720px; display: block; }
  #next { opacity: 0; }
  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; pointer-events: none;
    transform-origin: 3px 2px; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .35)); }
  .steps { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 24px; height: 30px;
    font: 20px/30px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    color: var(--muted); white-space: nowrap; }
  .steps span { display: inline-flex; align-items: center; gap: 7px; opacity: .62; }
  .steps b { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--win); background: var(--muted); }
  .steps i { font-style: normal; opacity: .45; }
  .steps span.on { opacity: 1; color: var(--fg); font-weight: 600; }
  .steps span.on b { background: var(--accent); color: #fff; }
</style>
<body>
<div class="stage">
  <div class="win">
    <div class="bar">
      <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
      <div class="title">
        <img src="../../../capcom/report/static/favicon.svg" width="16" height="16" alt="">
        capcom <small>127.0.0.1</small>
      </div>
    </div>
    <div class="screen">
      <img id="shot" alt="">
      <img id="next" alt="">
      <svg id="cursor" viewBox="0 0 22 22">
        <path d="M3 2 L3 18.5 L7.2 14.6 L9.9 20.6 L12.6 19.4 L10 13.5 L15.8 13.5 Z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
  <div class="steps" id="steps"></div>
</div>
<script>
  // The caption strip: the story's steps, set once by record.py.
  function steps(names) {
    const box = document.getElementById('steps');
    box.innerHTML = '';
    names.forEach((n, i) => {
      if (i) { const arrow = document.createElement('i'); arrow.textContent = '→'; box.append(arrow); }
      const s = document.createElement('span');
      const b = document.createElement('b');
      b.textContent = String(i + 1);
      s.append(b, n);
      box.append(s);
    });
  }
  // One frame: the page's screenshot, the cursor at (x, y) in page pixels, pressed
  // or not, the current step, and optionally a second screenshot mixed over it (the
  // loop's cross-fade).
  async function show(f) {
    const shot = document.getElementById('shot'), next = document.getElementById('next');
    if (shot.getAttribute('src') !== f.src) { shot.src = f.src; await shot.decode(); }
    if (f.next) { if (next.getAttribute('src') !== f.next) { next.src = f.next; await next.decode(); } }
    next.style.opacity = f.next ? f.mix : 0;
    const c = document.getElementById('cursor');
    c.style.display = f.x == null ? 'none' : '';
    c.style.transform = `translate(${f.x - 3}px, ${f.y - 2}px) scale(${f.press ? 0.86 : 1})`;
    [...document.querySelectorAll('#steps span')].forEach((s, i) => s.classList.toggle('on', i === f.step));
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  }
</script>
</body>
